packages:
  gcc:
    externals:
    - spec: gcc@16.1.0 languages='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/lib64/distcc/gcc
          cxx: /usr/lib64/distcc/g++
          fortran: /bin/gfortran
        flags:
          fflags: -fallow-argument-mismatch
  all:
    target: [zen2]
    variants: build_type=Release
  dd4hep:
    require: +edm4hep+lcio+xercesc+hepmc3
  guinea-pig:
    variants: +fftw3
  fftw:
    variants: -mpi
  range-v3:
    # avoid building doxygen
    variants: ~doc
#  geant4:
#    version: [ 10.7.3 ]
#    variants: ~qt~opengl+vecgeom
  marlin:
    # avoid building mariadb
    variants: ~lccd
  boost:
    variants: +python
  whizard:
    variants: ~fastjet~latex+lcio~lhapdf+openloops~openmp+pythia8
  evtgen:
    variants: +photos
  py-setuptools-scm:
    variants: +toml
  binutils:
    variants: +plugins
#  python:
#    version: [3.14.7]
  edm4hep:
    variants: cxxstd=20
  fastjet:
    variants: cxxstd=20
  ilcutil:
    variants: cxxstd=20
  lcio:
    variants: cxxstd=20
  pythia8:
    require: +gzip+hepmc3
    variants: cxxstd=20
  sio:
    variants: cxxstd=20
  k4fwcore:
    version: [ main ]
  k4edm4hep2lcioconv:
    version: [ main ]
  k4marlinwrapper:
    version: [ main ]
  fccanalyses:
    version: [ master ]
  k4gen:
    version: [ main ]
  k4simdelphes:
    version: [ main ]
  k4simgeant4:
    version: [ main ]
  k4reccalorimeter:
    version: [ main ]
  fccsw:
    version: [ master ]
  k4geo:
    version: [ main ]
  dual-readout:
    version: [ master ]
  opengl:
    buildable: False
    externals:
      - spec: opengl@4.5.0
        prefix: /usr

